when:
  - event: pull_request
    branch: master
    path:
      exclude: ['**/*.md', 'docs/**']
  - event: push
    branch: master
    path:
      exclude: ['**/*.md', 'docs/**']

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.9.2@sha256:a36586dfe77e9c5d9b5bff3ad37f18158eb12036aa9e9908e2e813ee6029573e
    settings:
      partial: false
      depth: 50

steps:
  - name: rust-check
    image: docker.io/library/rust:1.90.0-slim-bookworm@sha256:64232e656c058f4468e8d024e990acff04f0fd5a5c0a88a574dc37773d7325c9
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libxdo-dev libssl-dev pkg-config
      - rm -rf /var/lib/apt/lists/*
      - cargo check --locked --manifest-path src-tauri/Cargo.toml
